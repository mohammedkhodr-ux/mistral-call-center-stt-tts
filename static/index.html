<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Dubai Authority - Virtual Assistant</title>
  <style>
    /* ── Digital Dubai Brand Palette ─────────────────────────────── */
    :root {
      --dd-teal:       #004851;
      --dd-teal-dark:  #00333a;
      --dd-teal-light: #006a77;
      --dd-gold:       #c8a951;
      --dd-gold-light: #e0c96e;
      --dd-white:      #ffffff;
      --dd-gray-50:    #f7f8fa;
      --dd-gray-100:   #eef0f3;
      --dd-gray-200:   #d9dde3;
      --dd-gray-400:   #9ca3af;
      --dd-gray-600:   #6b7280;
      --dd-gray-800:   #1f2937;
      --dd-red:        #dc2626;
      --dd-green:      #16a34a;
      --radius:        12px;
      --shadow:        0 2px 12px rgba(0,72,81,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dd-gray-50);
      color: var(--dd-gray-800);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--dd-teal) 0%, var(--dd-teal-dark) 100%);
      color: var(--dd-white);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo {
      width: 40px;
      height: 40px;
      background: var(--dd-gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: var(--dd-teal-dark);
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .header-subtitle {
      font-size: 11px;
      opacity: 0.75;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-badge {
      background: rgba(200,169,81,0.2);
      border: 1px solid var(--dd-gold);
      color: var(--dd-gold-light);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* ── Chat Container ──────────────────────────────────────────── */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 0;
      overflow: hidden;
    }

    /* ── Messages Area ───────────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--dd-gray-200); border-radius: 3px; }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 80%;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.assistant { align-self: flex-start; }
    .msg.user      { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg.assistant .msg-avatar {
      background: var(--dd-teal);
      color: var(--dd-gold);
    }

    .msg.user .msg-avatar {
      background: var(--dd-gold);
      color: var(--dd-teal-dark);
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 14px;
      box-shadow: var(--shadow);
    }

    .msg.assistant .msg-bubble {
      background: var(--dd-white);
      border: 1px solid var(--dd-gray-100);
      border-bottom-left-radius: 4px;
    }

    .msg.user .msg-bubble {
      background: var(--dd-teal);
      color: var(--dd-white);
      border-bottom-right-radius: 4px;
    }

    .msg-bubble p { margin-bottom: 8px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble ul, .msg-bubble ol { margin: 4px 0 8px 18px; }
    .msg-bubble li { margin-bottom: 2px; }
    .msg-bubble strong { font-weight: 600; }
    .msg-bubble a { color: var(--dd-gold); }
    .msg.user .msg-bubble a { color: var(--dd-gold-light); }

    /* ── Typing Indicator ────────────────────────────────────────── */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      gap: 10px;
      max-width: 80%;
      padding: 0 20px 8px;
    }

    .typing-indicator.visible { display: flex; }

    .typing-dots {
      background: var(--dd-white);
      border: 1px solid var(--dd-gray-100);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 14px 20px;
      display: flex;
      gap: 5px;
      box-shadow: var(--shadow);
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      background: var(--dd-gray-400);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ── Welcome Card ────────────────────────────────────────────── */
    .welcome-card {
      background: linear-gradient(135deg, var(--dd-teal) 0%, var(--dd-teal-light) 100%);
      color: var(--dd-white);
      border-radius: var(--radius);
      padding: 28px 24px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
    }

    .welcome-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .welcome-card p {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.5;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .quick-action {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--dd-white);
      cursor: pointer;
      transition: background 0.15s;
      text-align: left;
    }

    .quick-action:hover {
      background: rgba(255,255,255,0.22);
    }

    .quick-action-icon {
      font-size: 18px;
      margin-bottom: 4px;
    }

    /* ── Input Area ──────────────────────────────────────────────── */
    .input-area {
      padding: 16px 20px 20px;
      background: var(--dd-white);
      border-top: 1px solid var(--dd-gray-100);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    #chatInput {
      width: 100%;
      border: 2px solid var(--dd-gray-200);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      min-height: 46px;
      max-height: 120px;
      line-height: 1.4;
    }

    #chatInput:focus {
      border-color: var(--dd-teal);
    }

    #chatInput::placeholder {
      color: var(--dd-gray-400);
    }

    .btn {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .btn-send {
      background: var(--dd-teal);
      color: var(--dd-white);
    }

    .btn-send:hover { background: var(--dd-teal-dark); }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-mic {
      background: var(--dd-gray-100);
      color: var(--dd-gray-600);
    }

    .btn-mic:hover { background: var(--dd-gray-200); }

    .btn-mic.recording {
      background: var(--dd-red);
      color: var(--dd-white);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0.4); }
      50%      { box-shadow: 0 0 0 8px rgba(220,38,38,0); }
    }

    .btn-speaker {
      background: var(--dd-gray-100);
      color: var(--dd-gray-600);
    }

    .btn-speaker:hover { background: var(--dd-gray-200); }

    .btn-speaker.active {
      background: var(--dd-gold);
      color: var(--dd-teal-dark);
    }

    /* ── SVG Icons ───────────────────────────────────────────────── */
    .icon { width: 20px; height: 20px; }

    /* ── Status Bar ──────────────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 0;
      font-size: 11px;
      color: var(--dd-gray-400);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--dd-green);
      display: inline-block;
      margin-right: 4px;
    }

    /* ── Audio Playback Indicator ────────────────────────────────── */
    .audio-playing {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--dd-teal);
      padding: 6px 0;
    }

    .audio-playing.visible { display: flex; }

    .audio-bars {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 16px;
    }

    .audio-bars span {
      width: 3px;
      background: var(--dd-teal);
      border-radius: 1px;
      animation: audioBar 0.8s infinite ease-in-out;
    }

    .audio-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .audio-bars span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
    .audio-bars span:nth-child(3) { height: 8px; animation-delay: 0.3s; }
    .audio-bars span:nth-child(4) { height: 14px; animation-delay: 0.45s; }
    .audio-bars span:nth-child(5) { height: 6px; animation-delay: 0.6s; }

    @keyframes audioBar {
      0%, 100% { transform: scaleY(0.5); }
      50%      { transform: scaleY(1.2); }
    }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .chat-container { max-width: 100%; }
      .msg { max-width: 90%; }
      .quick-actions { grid-template-columns: 1fr; }
      .header-badge { display: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="header-logo">DD</div>
      <div>
        <div class="header-title">Digital Dubai Authority</div>
        <div class="header-subtitle">Virtual Assistant</div>
      </div>
    </div>
    <div class="header-badge">Powered by Mistral AI</div>
  </header>

  <!-- Chat -->
  <div class="chat-container">
    <div class="messages" id="messages">

      <!-- Welcome -->
      <div class="welcome-card">
        <h2>Welcome to Digital Dubai</h2>
        <p>I'm your virtual assistant for Dubai government services. Ask me about DubaiNow, UAE PASS, visa services, bill payments, and more. You can type or use voice.</p>
        <div class="quick-actions">
          <button class="quick-action" onclick="sendQuick('How do I register for UAE PASS?')">
            <div class="quick-action-icon">&#x1F4F1;</div>
            UAE PASS Registration
          </button>
          <button class="quick-action" onclick="sendQuick('How can I pay traffic fines online?')">
            <div class="quick-action-icon">&#x1F697;</div>
            Pay Traffic Fines
          </button>
          <button class="quick-action" onclick="sendQuick('What services are available on DubaiNow?')">
            <div class="quick-action-icon">&#x1F3D9;</div>
            DubaiNow Services
          </button>
          <button class="quick-action" onclick="sendQuick('How do I apply for a business license in Dubai?')">
            <div class="quick-action-icon">&#x1F4BC;</div>
            Business License
          </button>
        </div>
      </div>

    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator">
      <div class="msg-avatar" style="background:var(--dd-teal);color:var(--dd-gold);">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 1 7 7v4a7 7 0 0 1-14 0V9a7 7 0 0 1 7-7z"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
      </div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="audio-playing" id="audioPlaying">
        <div class="audio-bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        Speaking...
      </div>
      <div class="input-row">
        <button class="btn btn-speaker" id="btnSpeaker" onclick="toggleTTS()" title="Toggle voice responses">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
        <div class="input-wrapper">
          <textarea id="chatInput" rows="1" placeholder="Type your question..." onkeydown="handleKey(event)"></textarea>
        </div>
        <button class="btn btn-mic" id="btnMic" onclick="toggleRecording()" title="Voice input">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="1" width="6" height="12" rx="3"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button class="btn btn-send" id="btnSend" onclick="sendMessage()" title="Send message">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="status-bar">
        <span><span class="status-dot"></span>Online</span>
        <span id="recordingStatus"></span>
      </div>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────
    const conversationHistory = [];
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let ttsEnabled = false;
    let currentAudio = null;

    const messagesEl     = document.getElementById('messages');
    const inputEl        = document.getElementById('chatInput');
    const btnSend        = document.getElementById('btnSend');
    const btnMic         = document.getElementById('btnMic');
    const btnSpeaker     = document.getElementById('btnSpeaker');
    const typingEl       = document.getElementById('typingIndicator');
    const audioPlayingEl = document.getElementById('audioPlaying');
    const recordingStatus = document.getElementById('recordingStatus');

    // ── Helpers ────────────────────────────────────────────────────

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setLoading(on) {
      typingEl.classList.toggle('visible', on);
      btnSend.disabled = on;
      if (on) scrollToBottom();
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      if (role === 'assistant') {
        avatar.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 1 7 7v4a7 7 0 0 1-14 0V9a7 7 0 0 1 7-7z"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>';
      } else {
        avatar.textContent = 'You';
        avatar.style.fontSize = '11px';
        avatar.style.fontWeight = '700';
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = formatMessage(text);

      div.appendChild(avatar);
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function formatMessage(text) {
      // Basic markdown-like formatting
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n- /g, '\n&bull; ')
        .replace(/\n\d+\. /g, (m) => '\n' + m.trim() + ' ')
        .replace(/\n/g, '<br>')
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
    }

    // ── Chat ──────────────────────────────────────────────────────

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      addMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });

      setLoading(true);

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory }),
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const reply = data.reply;

        conversationHistory.push({ role: 'assistant', content: reply });
        setLoading(false);
        addMessage('assistant', reply);

        if (ttsEnabled) {
          speakText(reply);
        }
      } catch (err) {
        setLoading(false);
        addMessage('assistant', 'Sorry, I encountered an error. Please try again.');
        console.error('Chat error:', err);
      }
    }

    function sendQuick(text) {
      inputEl.value = text;
      sendMessage();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // ── Voice Recording (STT) ─────────────────────────────────────

    async function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: getSupportedMimeType() });
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
          await transcribeAudio(blob);
        };

        mediaRecorder.start();
        isRecording = true;
        btnMic.classList.add('recording');
        recordingStatus.textContent = 'Recording... click mic to stop';
      } catch (err) {
        console.error('Mic error:', err);
        recordingStatus.textContent = 'Microphone access denied';
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      btnMic.classList.remove('recording');
      recordingStatus.textContent = 'Transcribing...';
    }

    function getSupportedMimeType() {
      const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
      for (const t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return 'audio/webm';
    }

    async function transcribeAudio(blob) {
      const formData = new FormData();
      const ext = blob.type.includes('mp4') ? '.mp4' : blob.type.includes('ogg') ? '.ogg' : '.webm';
      formData.append('audio', blob, `recording${ext}`);

      try {
        const resp = await fetch('/api/stt', {
          method: 'POST',
          body: formData,
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        if (data.text && data.text.trim()) {
          inputEl.value = data.text.trim();
          recordingStatus.textContent = 'Transcription complete';
          // Auto-send the transcribed text
          sendMessage();
        } else {
          recordingStatus.textContent = 'No speech detected';
        }
      } catch (err) {
        console.error('STT error:', err);
        recordingStatus.textContent = 'Transcription failed';
      }

      setTimeout(() => { recordingStatus.textContent = ''; }, 3000);
    }

    // ── TTS ───────────────────────────────────────────────────────

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      btnSpeaker.classList.toggle('active', ttsEnabled);
    }

    async function speakText(text) {
      // Stop any currently playing audio
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      // Strip markdown for cleaner speech
      const cleanText = text
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/\[(.*?)\]\(.*?\)/g, '$1')
        .replace(/#{1,6}\s/g, '');

      try {
        audioPlayingEl.classList.add('visible');

        const resp = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: cleanText }),
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        if (data.audio) {
          const audioBytes = atob(data.audio);
          const audioArray = new Uint8Array(audioBytes.length);
          for (let i = 0; i < audioBytes.length; i++) {
            audioArray[i] = audioBytes.charCodeAt(i);
          }

          // Try wav first, fall back to other formats
          const blob = new Blob([audioArray], { type: 'audio/wav' });
          const url = URL.createObjectURL(blob);

          currentAudio = new Audio(url);
          currentAudio.onended = () => {
            audioPlayingEl.classList.remove('visible');
            URL.revokeObjectURL(url);
            currentAudio = null;
          };
          currentAudio.onerror = () => {
            audioPlayingEl.classList.remove('visible');
            URL.revokeObjectURL(url);
            currentAudio = null;
          };
          currentAudio.play();
        }
      } catch (err) {
        console.error('TTS error:', err);
        audioPlayingEl.classList.remove('visible');
      }
    }
  </script>
</body>
</html>
